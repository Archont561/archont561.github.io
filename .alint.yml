version: 1
rules:
  - id: docs-sections-have-index
    kind: dir_contains
    select: docs/*
    require:
      - index.mdx
    level: error
  - id: unique-doc-headings
    kind: markdown_no_duplicate_headings
    paths: docs/**/*.mdx
    level: error
  - id: images-have-alt
    kind: markdown_images_have_alt
    paths: docs/**/*.mdx
    level: error
  - id: no-empty-docs
    kind: no_empty_files
    paths: docs/**/*.mdx
    level: error

  - id: required-file-01
    kind: file_exists
    paths: "README.md"
    level: error
  - id: required-file-02
    kind: file_exists
    paths: "AGENTS.md"
    level: error
  - id: required-file-03
    kind: file_exists
    paths: "CONTRIBUTING.md"
    level: error
  - id: required-file-04
    kind: file_exists
    paths: "LICENSE"
    level: error
  - id: required-file-05
    kind: file_exists
    paths: "package.json"
    level: error
  - id: required-file-06
    kind: file_exists
    paths: ".alint.yml"
    level: error
  - id: required-file-07
    kind: file_exists
    paths: ".lychee.toml"
    level: error
  - id: required-file-08
    kind: file_exists
    paths: ".devcontainer/devcontainer.json"
    level: error
  - id: required-file-09
    kind: file_exists
    paths: "pixi.toml"
    level: error
  - id: required-file-10
    kind: file_exists
    paths: "pixi.lock"
    level: error
  - id: required-file-11
    kind: file_exists
    paths: "pixi-sandbox.toml"
    level: error
  - id: required-file-12
    kind: file_exists
    paths: "scripts/restore.sh"
    level: error
  - id: required-file-13
    kind: file_exists
    paths: "templates/README.md.ejs"
    level: error
  - id: required-file-14
    kind: file_exists
    paths: "bun.lock"
    level: error
  - id: required-file-15
    kind: file_exists
    paths: "lefthook.yml"
    level: error
  - id: required-file-16
    kind: file_exists
    paths: "biome.json"
    level: error
  - id: required-file-17
    kind: file_exists
    paths: "turbo.json"
    level: error
  - id: required-file-18
    kind: file_exists
    paths: "docs/index.mdx"
    level: error
  - id: required-file-19
    kind: file_exists
    paths: "data/packages-manifest.json"
    level: error
  - id: required-file-20
    kind: file_exists
    paths: "data/packages.json"
    level: error
  - id: required-file-21
    kind: file_exists
    paths: "data/repositories.json"
    level: error
  - id: immutable-actions
    kind: pinned_references
    paths: [".github/workflows/*.yml"]
    format: github_actions
    level: error
  - id: no-merge-markers
    kind: no_merge_conflict_markers
    paths: ["apps/**", "packages/**", "docs/**", ".github/**"]
    level: error
  - id: no-bidi-controls
    kind: no_bidi_controls
    paths: ["apps/**", "packages/**", "docs/**", ".github/**"]
    level: error
